name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: end-to-end (example shop in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # GitHub's Ubuntu images ship Google Chrome, which the collector launches with channel "chrome".
      - run: pnpm e2e
      # The README demo app (D-136): run_action auto-starts lightpath dev and traces "Mark as paid".
      - run: node scripts/e2e-invoices.mjs
      # Checking a fix in one call (D-144): the demo bug, its trace, the fix, run_action with compareTo.
      - run: node scripts/e2e-invoices-fix.mjs
      - run: LIGHTPATH_BROWSER_TESTS=1 pnpm --filter @lightpath-dev/browser test

  editor:
    name: editor end-to-end (VS Code + example shop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The test downloads VS Code stable (about 150 MB); keep it between runs.
      - uses: actions/cache@v4
        with:
          path: extensions/vscode/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ github.run_id }}
          restore-keys: vscode-test-${{ runner.os }}-
      # VS Code needs a display; xvfb-run gives it a virtual one.
      - run: xvfb-run -a pnpm test:vscode

  setup:
    name: agent setup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # No agent is installed. For Claude Code, Cursor, VS Code and Kiro: pack the packages, install
      # them in a fresh project, run lightpath init, start the configured command offline and ask
      # it for initialize and tools/list, then run lightpath doctor (D-120).
      - run: node scripts/setup-check.mjs

  first-run:
    name: first run from the README (${{ matrix.os }}, published CLI)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No pnpm install and no build: only the README's steps, with the CLI from npm. examples/invoices
      # is copied out of the repo, gets its own npm install, and an empty npm cache makes the start
      # cold. A script plays the agent: it starts the server .mcp.json names and calls run_action.
      # Step timings are printed at the end of the log and saved as an artifact.
      - name: install, init, doctor, first trace (examples/invoices)
        shell: bash
        run: >
          node scripts/first-run.mjs --copy examples/invoices --app "$RUNNER_TEMP/invoices"
          --install "npm install" --cold
          --target 'button "Mark as paid"' --within "Kestrel Labs"
          --ports 3002,5174 --log "$RUNNER_TEMP/first-run-${{ matrix.os }}.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: first-run-${{ matrix.os }}
          path: ${{ runner.temp }}/first-run-${{ matrix.os }}.json
          if-no-files-found: ignore

  e2e-api:
    name: backend end-to-end (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The shop's API under type stripping, tsx, and tsx watch, through the real CLI. No browser.
      - run: pnpm e2e:api
