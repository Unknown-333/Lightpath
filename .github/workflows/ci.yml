name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  e2e:
    name: end-to-end (example shop in Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # GitHub's Ubuntu images ship Google Chrome, which the collector launches with channel "chrome".
      - run: pnpm e2e
      - run: LIGHTPATH_BROWSER_TESTS=1 pnpm --filter @lightpath/browser test
