name: Bug report
description: A click traced the wrong code, no code, or Lightpath failed to start.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Before you paste terminal output, remove secrets: tokens, passwords, cookies, API keys, and private URLs.
  - type: textarea
    id: clicked
    attributes:
      label: What you clicked
      description: The button, link, or form you used, and what it does in your app.
      placeholder: The "Save" button on the settings page, which sends PUT /api/settings.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What the trace showed, and what you expected
      placeholder: |
        Showed: only frontend files, no backend.
        Expected: the PUT /api/settings handler in server/routes/settings.ts.
    validations:
      required: true
  - type: input
    id: frontend
    attributes:
      label: Frontend stack
      description: Framework and bundler, with versions if you know them.
      placeholder: React 19 + Vite 7 (or Vue, Svelte, ...; webpack, Next.js, ...)
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Backend stack
      description: Framework, and what runs it.
      placeholder: Express 5 run by tsx (or Fastify, Nest, ...; node, ts-node, nodemon, ...)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "24.13.0"
  - type: input
    id: browser
    attributes:
      label: Browser
      placeholder: Chrome 156 (or Edge, Brave, ...)
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `npx @lightpath-dev/cli doctor`
      description: Run it in the folder where you start `lightpath dev`.
      render: text
    validations:
      required: true
  - type: textarea
    id: trace
    attributes:
      label: Terminal trace
      description: What Lightpath printed for the click, if anything.
      render: text
