<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lightpath demo shop</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1f2328; }
      button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid #d0d7de; background: #f6f8fa; cursor: pointer; }
      button.primary { background: #1f883d; color: white; border-color: #1a7f37; }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      li { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #eaeef2; }
      .notice { padding: 8px 12px; border-radius: 6px; background: #ddf4ff; }
      .error { background: #ffebe9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
